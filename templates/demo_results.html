<!DOCTYPE html>
<html>
<head>
    <title>Exam Results - Viva Demo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 10px;
        }
        h2 {
            color: #2d3748;
            margin: 30px 0 15px 0;
            font-size: 24px;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
        }
        .btn-back {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .btn-back:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .score-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .score-card .model {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        .score-card .score {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .score-card .categories {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 10px;
        }
        .section {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .section h3 {
            color: #2d3748;
            margin-bottom: 15px;
        }
        .assessment {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
        }
        .assessment .model-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }
        .assessment .text {
            color: #4a5568;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn-back">← Back to Home</a>

        <div class="card">
            <h1>Exam Results</h1>
            <p class="subtitle" id="studentInfo">Session {{ session_id }}</p>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px; color: #718096;">Loading results...</p>
            </div>

            <div id="results" style="display: none;">
                <h2>📄 Part A: Manuscript Quality</h2>
                <div class="score-grid" id="manuscriptScores"></div>
                <div class="section" id="manuscriptAssessments"></div>

                <h2>🎤 Part B: Oral Examination</h2>
                <div class="score-grid" id="oralScores"></div>
                <div class="section" id="oralAssessments"></div>
            </div>

            <div id="error" style="display: none; padding: 20px; background: #fed7d7; color: #742a2a; border-radius: 8px;">
                <strong>Error:</strong> <span id="errorMsg"></span>
            </div>
        </div>
    </div>

    <script>
        const sessionId = {{ session_id }};

        async function loadResults() {
            try {
                const response = await fetch(`/api/results/${sessionId}`);
                if (!response.ok) throw new Error('Failed to load results');

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMsg').textContent = error.message;
            }
        }

        function displayResults(data) {
            document.getElementById('studentInfo').textContent =
                `${data.student_name} - ${data.exam_type} - ${new Date(data.created_at).toLocaleDateString()}`;

            // Manuscript scores
            const manuscriptScores = document.getElementById('manuscriptScores');
            const manuscriptAssessments = document.getElementById('manuscriptAssessments');
            manuscriptAssessments.innerHTML = '<h3>Detailed Assessments</h3>';

            data.manuscript_scores.forEach(result => {
                const avgScore = result.score.toFixed(2);
                manuscriptScores.innerHTML += `
                    <div class="score-card">
                        <div class="model">${result.model}</div>
                        <div class="score">${avgScore}/4.0</div>
                        <div class="categories">Clarity • Coherence • Comprehensiveness</div>
                    </div>
                `;

                manuscriptAssessments.innerHTML += `
                    <div class="assessment">
                        <div class="model-name">${result.model}</div>
                        <div class="text">${result.assessment ? result.assessment.substring(0, 300) + '...' : 'Assessment not available'}</div>
                    </div>
                `;
            });

            // Oral scores
            const oralScores = document.getElementById('oralScores');
            const oralAssessments = document.getElementById('oralAssessments');
            oralAssessments.innerHTML = '<h3>Detailed Assessments</h3>';

            data.oral_scores.forEach(result => {
                const avgScore = result.score.toFixed(2);
                oralScores.innerHTML += `
                    <div class="score-card">
                        <div class="model">${result.model}</div>
                        <div class="score">${avgScore}/4.0</div>
                        <div class="categories">Understanding • Reasoning • Alternatives</div>
                    </div>
                `;

                oralAssessments.innerHTML += `
                    <div class="assessment">
                        <div class="model-name">${result.model}</div>
                        <div class="text">${result.assessment ? result.assessment.substring(0, 300) + '...' : 'Assessment not available'}</div>
                    </div>
                `;
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').style.display = 'block';
        }

        loadResults();
    </script>
</body>
</html>
